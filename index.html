
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Command Center</title>
<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 20px;
  background: #E9E1D3;
  color: #244B68;
  font-family: Georgia, serif;
}

.panel {
  max-width: 900px;
  margin: auto;
  padding: 28px 34px;
  border: 1px solid #C9BFAF;
  border-radius: 14px;
  background: #F4EFE6;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 24px;
  flex-wrap: wrap;
}

.label {
  font: 11px Arial, sans-serif;
  letter-spacing: 3px;
  text-transform: uppercase;
  color: #718675;
  margin-bottom: 12px;
}

#day { font-size: 27px; margin-bottom: 7px; }

#date {
  font: 14px Arial, sans-serif;
  color: #52636A;
}

#clock {
  font-size: clamp(38px, 7vw, 64px);
  letter-spacing: 2px;
  font-variant-numeric: tabular-nums;
}

.rule {
  height: 2px;
  width: 52px;
  background: #B99A5B;
  margin-top: 18px;
}

.connection {
  max-width: 900px;
  margin: 16px auto 0;
  padding: 24px 28px;
  border: 1px solid #C9BFAF;
  border-radius: 14px;
  background: #F4EFE6;
}

.connection .label { margin-bottom: 10px; }

.description {
  font: 13px/1.6 Arial, sans-serif;
  color: #52636A;
  margin: 0 0 16px;
}

.key-input {
  width: 100%;
  padding: 12px 14px;
  border: 1px solid #C9BFAF;
  border-radius: 8px;
  background: #FBF8F2;
  color: #244B68;
  font: 14px Arial, sans-serif;
  margin-bottom: 12px;
}

.actions {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}

.action-button {
  padding: 11px 17px;
  border: 0;
  border-radius: 8px;
  background: #244B68;
  color: #F4EFE6;
  font: 12px Arial, sans-serif;
  cursor: pointer;
}

.action-button.secondary {
  background: #E9E1D3;
  color: #244B68;
  border: 1px solid #C9BFAF;
}

.action-button:disabled {
  opacity: .55;
  cursor: wait;
}

#connection-status {
  margin-top: 15px;
  font: 13px/1.6 Arial, sans-serif;
  color: #52636A;
  overflow-wrap: anywhere;
}

@media(max-width: 560px) {
  .panel { padding: 24px; }
  .right { width: 100%; }
  .connection { padding: 22px; }
}
</style>
</head>

<body>

<main class="panel">
  <section>
    <div class="label">My Command Center</div>
    <div id="day"></div>
    <div id="date"></div>
    <div class="rule"></div>
  </section>

  <section class="right">
    <div class="label">Mountain Time</div>
    <div id="clock"></div>
  </section>
</main>

<section class="connection">
  <div class="label">Notion Connection</div>
  <p class="description">
    Connect your private Tasks and Daily Log databases to your Command Center.
  </p>

  <input
    id="widget-key"
    class="key-input"
    type="password"
    autocomplete="off"
    placeholder="Enter your private access key"
    aria-label="Private access key"
  >

  <div class="actions">
    <button id="connect-button" class="action-button">
      Test Connection
    </button>
    <button id="clear-button" class="action-button secondary">
      Clear Saved Key
    </button>
  </div>

  <div id="connection-status" aria-live="polite">
    Not connected yet.
  </div>
</section>

<script>
const API_BASE = "https://command-center-api.doxadenice.workers.dev";
const STORAGE_KEY = "commandCenterWidgetKey";

function updateClock() {
  const now = new Date();

  document.getElementById("day").textContent =
    new Intl.DateTimeFormat("en-US", {
      timeZone: "America/Denver",
      weekday: "long"
    }).format(now);

  document.getElementById("date").textContent =
    new Intl.DateTimeFormat("en-US", {
      timeZone: "America/Denver",
      month: "long",
      day: "numeric",
      year: "numeric"
    }).format(now);

  document.getElementById("clock").textContent =
    new Intl.DateTimeFormat("en-US", {
      timeZone: "America/Denver",
      hour: "numeric",
      minute: "2-digit",
      hour12: true
    }).format(now);
}

updateClock();
setInterval(updateClock, 60000);

const keyInput = document.getElementById("widget-key");
const connectButton = document.getElementById("connect-button");
const clearButton = document.getElementById("clear-button");
const statusBox = document.getElementById("connection-status");

keyInput.value = localStorage.getItem(STORAGE_KEY) || "";

async function checkDatabase(resource, key) {
  const response = await fetch(
    `${API_BASE}/?resource=${encodeURIComponent(resource)}`,
    {
      method: "GET",
      headers: {
        "X-Widget-Key": key
      }
    }
  );

  const data = await response.json();

  if (!response.ok || !data.success) {
    throw new Error(data.error || `Unable to connect to ${resource}.`);
  }

  return data;
}

connectButton.addEventListener("click", async () => {
  const key = keyInput.value.trim();

  if (!key) {
    statusBox.textContent = "Please enter your access key.";
    return;
  }

  connectButton.disabled = true;
  statusBox.textContent = "Testing both Notion databases...";

  try {
    const tasks = await checkDatabase("tasks", key);
    const dailyLog = await checkDatabase("daily-log", key);

    localStorage.setItem(STORAGE_KEY, key);

    statusBox.textContent =
      `Connected successfully. Tasks: ${tasks.count} records. ` +
      `Daily Log: ${dailyLog.count} records. Your key is saved in this browser.`;

  } catch (error) {
    statusBox.textContent = `Connection failed: ${error.message}`;
  } finally {
    connectButton.disabled = false;
  }
});

clearButton.addEventListener("click", () => {
  localStorage.removeItem(STORAGE_KEY);
  keyInput.value = "";
  statusBox.textContent = "Saved key cleared from this browser.";
});
</script>

</body>
</html>
